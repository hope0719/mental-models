<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<line x1="80" y1="326" x2="524" y2="326" stroke="#B4B2A9" stroke-width="0.5" marker-end="url(#arrow)"/>
<line x1="80" y1="326" x2="80" y2="66" stroke="#B4B2A9" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="80" y="56" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">混乱程度</text>
<text x="498" y="346" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">时间</text>
<path d="M80,300 C170,295 240,270 300,225 C360,180 430,140 520,112" fill="none" stroke="#A32D2D" stroke-width="2"/>
<path d="M80,300 C130,284 152,301 190,279 C230,256 250,283 290,259 C330,236 350,266 390,241 C430,216 452,241 490,216 C506,206 512,200 520,196" fill="none" stroke="#BA7517" stroke-width="2"/>
<path d="M80,300 C110,284 130,262 170,252 C210,242 230,258 270,248 C310,238 330,254 370,246 C410,238 430,252 470,244 C492,240 508,242 520,240" fill="none" stroke="#0F6E56" stroke-width="2"/>
<line x1="524" y1="112" x2="534" y2="112" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="524" y1="196" x2="534" y2="196" stroke="#B4B2A9" stroke-width="0.5"/>
<line x1="524" y1="240" x2="534" y2="240" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="538" y="108" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#791F1F">完全不干预</text>
<text x="538" y="123" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">走向崩坏</text>
<text x="538" y="192" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#854F0B">无方向的忙</text>
<text x="538" y="207" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">仍在恶化</text>
<text x="538" y="236" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#0F6E56">定向做功</text>
<text x="538" y="251" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">靠能量维持</text>
<text x="86" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#888780">起点</text>
