<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>三种状态下混乱程度随时间的变化</title>
<desc>完全不干预时混乱程度快速上升，无序扰动时仍然上升但稍有波动，定向做功可以把混乱程度压在一个较低水平并维持。</desc>
<defs>
