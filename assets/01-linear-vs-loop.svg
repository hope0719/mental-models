<svg viewBox="0 0 680 250" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>线性模式与自持回路的差别</title>
<desc>左图投入单向变成产出后流失，停止投入即归零；右图产出回流成为下一次投入，系统可以自持。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text x="40" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#791F1F">线性：产出不回流</text>
<rect x="40" y="70" width="96" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="88" y="93" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#501313">投入</text>
<rect x="186" y="70" width="96" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="234" y="93" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#501313">产出</text>
<line x1="140" y1="93" x2="182" y2="93" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="286" y1="93" x2="330" y2="93" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="288" y="82" font-family="system-ui, sans-serif" font-size="11" fill="#888780">流失</text>
<text x="40" y="150" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">停手即归零，投入总量等于产出总量</text>
<line x1="336" y1="40" x2="336" y2="210" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="368" y="46" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F6E56">回路：产出变成下一次投入</text>
<rect x="368" y="70" width="96" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="416" y="93" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">投入</text>
<rect x="512" y="70" width="96" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="560" y="93" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#04342C">产出</text>
<line x1="468" y1="93" x2="508" y2="93" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M560 118 L560 152 L416 152 L416 120" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="430" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#5F5E5A">成果可复用、可沉淀</text>
<text x="368" y="198" font-family="system-ui, sans-serif" font-size="12" fill="#5F5E5A">生成大于泄漏，系统开始自持</text>
</svg>
